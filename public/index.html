<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>전국 약국 위치 + 실시간 날씨 Mashup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-3">
    <div class="container-fluid">
        <span class="navbar-brand">💊 전국 약국 + 실시간 날씨 Mashup</span>
        <span class="navbar-text text-light fw-bold">2024810112 최문종</span>
    </div>
</nav>

<div class="container">

    <!-- 개요 -->
    <div class="card mb-3">
        <div class="card-body small">
            <b>건강보험심사평가원 약국 API</b> + <b>기상청 초단기 실황 API</b> + <b>Kakao Map</b>을 이용한 Mashup 서비스입니다.
        </div>
    </div>

    <!-- 검색 -->
    <div class="row mb-3">
        <div class="col-md-4 mb-2">
            <label class="form-label">시도 선택</label>
            <select id="regionSelect" class="form-select">
                <option value="서울">서울</option>
                <option value="부산">부산</option>
                <option value="대구">대구</option>
                <option value="인천">인천</option>
                <option value="광주">광주</option>
                <option value="대전">대전</option>
                <option value="울산">울산</option>
                <option value="세종">세종</option>
                <option value="경기">경기</option>
                <option value="강원">강원</option>
                <option value="충북">충북</option>
                <option value="충남">충남</option>
                <option value="전북">전북</option>
                <option value="전남">전남</option>
                <option value="경북">경북</option>
                <option value="경남">경남</option>
                <option value="제주">제주</option>
            </select>
        </div>

        <div class="col-md-3 mb-2">
            <label class="form-label d-block">&nbsp;</label>
            <button id="searchBtn" class="btn btn-primary w-100">검색</button>
        </div>

        <div class="col-md-5 small">
            <label class="form-label">요약</label>
            <div class="border rounded bg-light px-3 py-2">
                약국 개수: <b id="pharmacyCount">0</b><br>
                날씨 상태: <b id="weatherStatus">-</b><br>
                기온: <b id="weatherTemp">-</b> ℃,
                습도: <b id="weatherHum">-</b> %,
                강수: <b id="weatherRain">-</b> mm,
                풍속: <b id="weatherWind">-</b> m/s
            </div>
        </div>
    </div>

    <!-- 지도 + 리스트 -->
    <div class="row">
        <div class="col-lg-8 mb-3">
            <div id="map"></div>
        </div>
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header">약국 목록</div>
                <ul id="pharmacyList" class="list-group list-group-flush small"></ul>
            </div>
        </div>
    </div>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8382196ca251c7706e3b7e1df97883e7&libraries=services"></script>
<script src="app.js?v=2"></script>
</body>
</html>
